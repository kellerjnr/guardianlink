{% extends 'base.html' %}{% block content %}<div class="col-md-7 col-lg-5 mx-auto"><div class="auth-heading text-center"><div class="auth-icon">✅</div><h1 class="h3">Choose a new password</h1><p>Use at least eight characters.</p></div><form method="post" class="card card-body auth-card"><label>New password</label><input class="form-control mb-3" name="password" type="password" minlength="8" autocomplete="new-password" required><label>Confirm new password</label><input class="form-control mb-3" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required><button class="btn btn-primary">Update password</button></form></div>{% endblock %}
