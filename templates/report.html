{% extends 'base.html' %}{% block content %}<div class="col-lg-8 mx-auto"><h1 class="h3">Submit an incident report</h1><form method="post" enctype="multipart/form-data" class="card card-body"><label>Incident type</label><select class="form-select mb-2" name="incident_type" required>{% for t in incident_types %}<option>{{t}}</option>{% endfor %}</select><label>Description</label><textarea class="form-control mb-2" name="description" minlength="15" required placeholder="Describe what happened. Do not include unnecessary private details."></textarea><label>Area/location name</label><input class="form-control mb-2" name="location_name" placeholder="e.g. Wuse 2, Abuja"><div class="row"><div class="col"><label>Latitude</label><input class="form-control mb-2" id="latitude" name="latitude" required></div><div class="col"><label>Longitude</label><input class="form-control mb-2" id="longitude" name="longitude" required></div></div><button type="button" class="btn btn-outline-secondary mb-2" onclick="useLocation()">Use my current location</button><label>Evidence (optional: image, PDF, or audio; max 5 MB)</label><input class="form-control mb-2" type="file" name="evidence"><div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="anonymous" id="anonymous"><label class="form-check-label" for="anonymous">Keep my identity hidden from responder list where possible</label></div><button class="btn btn-danger">Submit securely</button></form></div><script>function useLocation(){navigator.geolocation.getCurrentPosition(p=>{latitude.value=p.coords.latitude;longitude.value=p.coords.longitude},()=>alert('Allow location access or enter coordinates manually.'))}</script>{% endblock %}
