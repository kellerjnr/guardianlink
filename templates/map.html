{% extends 'base.html' %}{% block content %}<h1 class="h3">Verified community safety alerts</h1><p class="text-muted">Locations are rounded to protect privacy. This page never displays live victim locations.</p><div id="map"></div><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([9.082,8.675],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const items={{ markers|tojson }};items.forEach(x=>L.marker([x.lat,x.lng]).addTo(map).bindPopup(`<b>${x.type}</b><br>${x.location}<br>${x.date}`));</script>{% endblock %}
