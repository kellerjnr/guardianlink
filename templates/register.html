{% extends 'base.html' %}{% block content %}<div class="col-md-7 mx-auto"><h1 class="h3">Create citizen account</h1><form method="post" class="card card-body"><label>Full name</label><input class="form-control mb-2" name="full_name" required><label>Email</label><input class="form-control mb-2" name="email" type="email" required><label>Password (at least 8 characters)</label><input class="form-control mb-2" name="password" type="password" minlength="8" required><label>Trusted contact phone number (optional)</label><input class="form-control mb-3" name="trusted_contact"><button class="btn btn-primary">Create account</button></form></div>{% endblock %}
